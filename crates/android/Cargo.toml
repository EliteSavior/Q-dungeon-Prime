[package]
name = "qdp_android"
description = "Android launcher for Q Dungeon Prime."
publish = false

version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
homepage.workspace = true
license.workspace = true
categories.workspace = true

[lib]
name = "qdp_android"
crate-type = ["cdylib"]

[dependencies]
de_game = { path = "../.." }
bevy.workspace = true

[package.metadata.android]
package = "com.elitesavior.qdungeonprime"
apk_name = "QDungeonPrime"
assets = "../../assets"
build_targets = ["aarch64-linux-android"]
# Dev-profile debuginfo makes the .so hundreds of megabytes. Strip symbols
# while still signing with the debug keystore.
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 33

[package.metadata.android.application]
label = "Q Dungeon Prime"
debuggable = true
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
extract_native_libs = true

[package.metadata.android.application.activity]
label = "Q Dungeon Prime"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode"
launch_mode = "singleTop"
orientation = "landscape"
